shell = "zsh"

# Load only the selected Oh My Zsh files, not its framework or themes.
[templates]
completions = '''
fpath=("{{ dir }}/src" $fpath)
'''
omz-aliases = '''
autoload -Uz is-at-least
zmodload zsh/parameter
zstyle ':omz:alpha:lib:git' async-prompt no
source "{{ dir }}/lib/clipboard.zsh"
source "{{ dir }}/lib/git.zsh"
# Retire the old Omarchy Git shortcuts; upstream names now take precedence.
unalias g gcm gcam gcad 2>/dev/null || true
source "{{ dir }}/plugins/git/git.plugin.zsh"
if (( $+commands[docker] )); then
    typeset -g ZSH_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/dotfiles/ohmyzsh"
    mkdir -p "$ZSH_CACHE_DIR/completions"
    fpath=("$ZSH_CACHE_DIR/completions" $fpath)
    source "{{ dir }}/plugins/docker/docker.plugin.zsh"
    source "{{ dir }}/plugins/docker-compose/docker-compose.plugin.zsh"
fi
# In particular, upstream gwip explicitly disables signing. Remove that and
# any future alias with the same opt-out rather than overriding Git itself.
() {
    local shortcut definition
    for shortcut in ${(k)aliases}; do
        definition=${(L)aliases[$shortcut]}
        case "$definition" in
            *--no-gpg-sign*|*commit.gpgsign=false*|*commit.gpgsign=0*)
                unalias "$shortcut"
                ;;
        esac
    done
}
'''

# Definitions must be present before compinit builds its function table.
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
use = ["src/*"]
apply = ["completions"]

[plugins.completion-init]
inline = '''
# dotfiles: managed-compinit
autoload -Uz compinit
compinit
if (( $+commands[fzf] )); then
    source <(fzf --zsh)
fi
zstyle ':completion:*' menu no
zstyle ':completion:*:descriptions' format '[%d]'
zstyle ':fzf-tab:*' switch-group '<' '>'
'''

[plugins.ohmyzsh-aliases]
github = "ohmyzsh/ohmyzsh"
use = ["plugins/git/git.plugin.zsh"]
apply = ["omz-aliases"]

[plugins.zsh-eza]
github = "z-shell/zsh-eza"

[plugins.zsh-you-should-use]
github = "MichaelAquilina/zsh-you-should-use"

# fzf-tab must follow compinit/fzf key bindings and precede widget wrappers.
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

# Highlighter comes after aliases and widget-wrapping plugins.
[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
