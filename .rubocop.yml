inherit_gem:
  rubocop-shopify: rubocop.yml

plugins:
  - rubocop-minitest

Minitest:
  Include:
    - 'tests/**/*.rb'

# 同じ利用場面の結果をまとめて検証し、assert数だけを理由に分割しない。
Minitest/MultipleAssertions:
  Enabled: false

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Include:
    - '**/*.rb'
    - Rakefile
  Exclude:
    - submodules/**/*
