[org/gnome/desktop/interface]
accent-color='purple'
clock-show-date=true
clock-show-weekday=true
color-scheme='prefer-dark'
toolkit-accessibility=false

[org/gnome/desktop/wm/keybindings]
switch-input-source=['<Super>space', 'XF86Keyboard']

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:close'

[org/gnome/desktop/peripherals/mouse]
natural-scroll=false
speed=-0.53488372093023262

[org/gnome/desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[org/gnome/desktop/input-sources]
sources=[('ibus', 'mozc-on'), ('ibus', 'mozc-off')]

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'

[org/gnome/shell/extensions/dash-to-dock]
apply-custom-theme=false
background-color='#202033'
background-opacity=0.81999999999999995
custom-background-color=true
custom-theme-customize-running-dots=true
custom-theme-running-dots-border-color='#171824'
custom-theme-running-dots-color='#d5ff3f'
custom-theme-shrink=true
dash-max-icon-size=48
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
icon-size-fixed=false
running-indicator-style='DOTS'
transparency-mode='FIXED'

[org/gnome/shell/extensions/clipboard-indicator]
clear-history-on-interval=false
clear-on-boot=true
confirm-clear=true
keep-selected-on-clear=true
move-item-first=true
notify-on-copy=true
open-at-cursor=true
paste-on-select=true
regex-search=true
strip-text=true
toggle-menu=['<Control><Alt>v']
