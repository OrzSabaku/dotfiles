shell = "zsh"

# Load only the selected Oh My Zsh files, not its framework or themes.
[templates]
completions = '''
fpath=("{{ dir }}/src" $fpath)
'''
omz-aliases = 'source "$HOME/.config/sheldon/omz-aliases.zsh" "{{ dir }}"'

# Definitions must be present before compinit builds its function table.
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
use = ["src/*"]
apply = ["completions"]

[plugins.completion-paths]
inline = '''
# 更新スクリプトが検証した世代の補完を使う。未生成ならOS標準の補完を使う。
if [[ -n ${DOTFILES_ZSH_COMPLETIONS:-} ]]; then
    fpath=("$DOTFILES_ZSH_COMPLETIONS" $fpath)
fi
fpath+=("${XDG_DATA_HOME:-$HOME/.local/share}/zsh/site-functions")
typeset -gU fpath
'''

[plugins.completion-init]
inline = '''
# dotfiles: managed-compinit
source "$HOME/.config/sheldon/completion-init.zsh"
'''

[plugins.generated-completion-scripts]
inline = '''
# autoload用の関数ファイルではなく、compdefを実行するCLIの出力を読む。
if [[ -n ${DOTFILES_ZSH_COMPLETIONS:-} ]]; then
    for completion_script in "$DOTFILES_ZSH_COMPLETIONS"/*.zsh(N); do
        source "$completion_script"
    done
fi
'''

[plugins.zoxide]
inline = 'if (( $+commands[zoxide] )); then eval "$(zoxide init zsh)"; fi'

[plugins.ohmyzsh-aliases]
github = "ohmyzsh/ohmyzsh"
use = ["plugins/git/git.plugin.zsh"]
apply = ["omz-aliases"]

[plugins.zsh-eza]
github = "z-shell/zsh-eza"

[plugins.zsh-you-should-use]
github = "MichaelAquilina/zsh-you-should-use"

# fzf-tab must follow compinit/fzf key bindings and precede widget wrappers.
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

# Highlighter comes after aliases and widget-wrapping plugins.
[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"

# 履歴キーバインドはfzfやウィジェットを包むプラグインの初期化後に設定する。
[plugins.atuin]
inline = '''
[[ -r "$HOME/.atuin/bin/env" ]] && source "$HOME/.atuin/bin/env"
if (( $+commands[atuin] )); then eval "$(atuin init zsh)"; fi
'''
