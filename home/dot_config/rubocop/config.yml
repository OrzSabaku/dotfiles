AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - 'tmp/**/*'
    - 'vendor/**/*'

# --- ドキュメント・コメント系 ---
Style/Documentation:
  Enabled: false

Style/AsciiComments:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# --- スクリプトの書きやすさ優先（Metrics緩和） ---
Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/BlockLength:
  Enabled: false

Layout/LineLength:
  Max: 120

Style/StringLiterals:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Style/BlockDelimiters:
  Enabled: false

Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
