name: Native scripts (Linux x86_64)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-scripts.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'Gemfile*'
      - 'Rakefile'
      - '.rubocop.yml'
  push:
    tags:
      - 'scripts-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dotfiles
    steps:
      - uses: actions/checkout@v6
        with:
          path: dotfiles
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: dotfiles

      - uses: jdx/mise-action@v3
        with:
          working_directory: dotfiles
          tool_versions: |
            chezmoi 2.74.1
            sheldon 0.8.5

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check Ruby sources
        run: |
          bundle exec rake test
          bundle exec rubocop --cache false

      - name: Check out the tested Spinel revision
        uses: actions/checkout@v6
        with:
          repository: matz/spinel
          ref: c1d162f68eb5d38fbc869f63c5615897b82b6243
          path: spinel
          persist-credentials: false

      - name: Build Spinel
        working-directory: spinel
        run: |
          make deps
          make -j2
          bin/spinel --version

      - name: Compile the three commands
        run: |
          mkdir -p dist/bin
          for name in setup-zsh update-zsh-plugins nvim-experiment; do
            ../spinel/bin/spinel "$PWD/scripts/$name.rb" --strict-require -o "dist/bin/$name"
          done

      - name: Check native commands
        run: bundle exec ruby -Itests tests/native_test.rb

      - name: Package the Linux x86_64 binaries
        run: |
          tar -C dist/bin -czf dist/dotfiles-scripts-linux-x86_64.tar.gz setup-zsh update-zsh-plugins nvim-experiment
          cd dist
          sha256sum dotfiles-scripts-linux-x86_64.tar.gz > dotfiles-scripts-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dotfiles-scripts-linux-x86_64
          path: |
            dotfiles/dist/*.tar.gz
            dotfiles/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/scripts-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dotfiles-scripts-linux-x86_64
          path: dist
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
